# One-command standup: docker compose up --build
# Copy .env.example → .env and set SMART_ROUTER_API_KEY (never commit .env).
# Provider keys (SMART_ROUTER_KEY_*) stay in env / volume — never in the image.

services:
  smart-router:
    build: .
    image: mirevox/smart-router:0.1.0
    ports:
      - "${SMART_ROUTER_PORT:-18765}:18765"
    # Compose auto-loads project `.env` for ${VAR} substitution when present.
    # No env_file entry — standup works with zero local files beyond the repo.
    environment:
      SMART_ROUTER_HOST: "0.0.0.0"
      SMART_ROUTER_PORT: "18765"
      SMART_ROUTER_API_KEY: "${SMART_ROUTER_API_KEY:-mirevox-dev-key}"
      SMART_ROUTER_STUB_MODE: "${SMART_ROUTER_STUB_MODE:-true}"
      SMART_ROUTER_CONFIG: /app/config/default.yaml
      SMART_ROUTER_VAULT_PATH: /app/data/vault.json
    volumes:
      - router-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18765/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  router-data:
